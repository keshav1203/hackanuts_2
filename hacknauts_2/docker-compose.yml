services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: scalepilot, POSTGRES_PASSWORD: scalepilot, POSTGRES_DB: scalepilot }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U scalepilot"], interval: 3s, retries: 20 }
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://scalepilot:scalepilot@db:5432/scalepilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment: *backend-env
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}" }
    ports: ["5173:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

volumes:
  pgdata:
